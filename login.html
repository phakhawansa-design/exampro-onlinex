<!DOCTYPE html>
<html lang="th">
<head>
    <script src="auth-client.js"></script>
  <script>
    if (window.location.protocol === 'file:') {
      const fileName = window.location.pathname.split('/').pop() || 'index.html';
      window.location.href = 'http://localhost:5000/' + fileName;
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ - ExamPro</title>
  <meta name="description" content="เข้าสู่ระบบ ExamPro สำหรับอาจารย์ นักศึกษา และผู้ดูแลระบบ" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { font-size: 100%; -webkit-text-size-adjust: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Noto Sans Thai Looped, sans-serif;
      background: linear-gradient(to right, #f8fafc 0%, #eff6ff 50%, #eef4ff 100%);
      color: #334155;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; }

    .grid-overlay {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(47,107,236,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47,107,236,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(100px); pointer-events: none; z-index: 0;
    }
    .blob-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: radial-pulse 8s ease-in-out infinite;
    }
    .blob-2 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(21,87,224, 0.04) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: radial-pulse 10s ease-in-out infinite reverse;
    }
    @keyframes radial-pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .content-layer { position: relative; z-index: 10; }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-top: 1px solid rgba(34,195,230, 0.25);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      border-radius: 24px;
    }

    /* Glass inputs */
    .glass-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 1);
      color: #1e293b;
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      width: 100%;
      font-family: Noto Sans Thai Looped, sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .glass-input::placeholder { color: #94a3b8; }
    .glass-input:focus {
      border-color: #22c3e6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(34,195,230, 0.15);
    }

    /* Submit button */
    .btn-submit {
      background: linear-gradient(135deg, #22c3e6 0%, #1557e0 100%);
      box-shadow: 0 4px 15px rgba(34,195,230, 0.2);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .btn-submit:hover:not(:disabled) {
      box-shadow: 0 4px 20px rgba(34,195,230, 0.35);
      transform: translateY(-2px);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Show password toggle */
    .toggle-pass {
      background: none; border: none; cursor: pointer;
      color: #64748b; padding: 0;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #22c3e6; }

    /* Links */
    .link-primary { color: #22c3e6; transition: color 0.2s; }
    .link-primary:hover { color: #22d3ee; }
    .link-secondary { color: #64748b; transition: color 0.2s; font-size: 0.8rem; }
    .link-secondary:hover { color: #cbd5e1; }

    /* Back link */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; font-size: 0.8rem; transition: color 0.2s;
    }
    .back-link:hover { color: #cbd5e1; }

    /* Divider line */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(226, 232, 240, 0.8), transparent);
    }

    /* Shield badge */
    .shield-badge {
      background: linear-gradient(135deg, rgba(34,195,230, 0.1), rgba(21,87,224, 0.1));
      border: 1px solid rgba(34,195,230, 0.2);
      border-radius: 16px;
      padding: 10px;
      display: inline-flex;
      font-size: 1.8rem;
      animation: shield-glow 3s ease-in-out infinite;
    }
    @keyframes shield-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(47,107,236,0.4); }
      50% { box-shadow: 0 0 40px rgba(47,107,236,0.75); }
    }

    /* Input wrapper */
    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #475569; pointer-events: none;
    }
    .input-action {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    }
  </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js" defer></script>
    <link rel="stylesheet" href="tailwind.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="grid-overlay"></div>

  <div class="content-layer min-h-screen flex flex-col items-center justify-center px-3 sm:px-4 py-6 sm:py-10">
    <div class="w-full max-w-md mx-auto">

      <!-- Card -->
      <div class="glass-card p-5 sm:p-8 md:p-10">

        <!-- Header -->
        <div class="flex flex-col items-center text-center mb-6 sm:mb-8">
          <div class="text-xs font-bold tracking-[0.3em] text-orange-500 uppercase mb-1">EXAMPRO</div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">เข้าสู่ระบบ</h1>
        </div>

        <!-- Error msg -->
        <div id="error-msg" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium text-rose-600 flex items-center gap-2"
             style="background:rgba(244,63,94,0.05);border:1px solid rgba(244,63,94,0.2);">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          </div>

        <!-- Form -->
        <div class="space-y-4 mb-6">
          <!-- Username -->
          <div>
            <label class="block text-sm font-medium text-slate-550 mb-1.5">รหัสนักศึกษา หรือ ชื่อผู้ใช้</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </span>
              <input id="username" type="text" class="glass-input" placeholder="เช่น 67311226543-5 หรือ username อาจารย์" autocomplete="username" />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-medium text-slate-550 mb-1.5">รหัสผ่าน</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </span>
              <input id="password" type="password" class="glass-input" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" />
              <span class="input-action">
                <button class="toggle-pass" onclick="togglePassword()" type="button" id="toggle-pass-btn" aria-label="แสดง/ซ่อนรหัสผ่าน">
                  <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </span>
            </div>
          </div>
        </div>

        <p class="text-xs text-slate-500 -mt-3 mb-5 leading-relaxed">นักศึกษาที่เข้าครั้งแรก ใช้รหัสผ่าน <b>1234</b> หรือ <b>4 หลักท้าย</b>ของรหัสนักศึกษา แล้วระบบจะให้ตั้งรหัสใหม่</p>

        <!-- Submit button -->
        <button id="login-btn" onclick="login()" class="btn-submit w-full py-3.5 rounded-xl text-white font-bold text-sm flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013 3h7a3 3 0 013 3v1"/>
          </svg>
          เข้าสู่ระบบ
        </button>

        <!-- Divider -->
        <div class="divider my-6"></div>

        <!-- Register link -->
        <div class="text-center mb-3">
          <span class="text-slate-500 text-sm">อาจารย์ยังไม่มีบัญชี? </span>
          <a href="register-teacher.html" class="link-primary text-sm font-semibold">สมัครสมาชิกใหม่</a>
        </div>

        <!-- Back link -->
        <div class="text-center">
          <a href="index.html" class="back-link justify-center">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            ย้อนกลับหน้าหลัก
          </a>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-center text-slate-450 text-xs mt-6 tracking-wider">ExamPro</p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
        `;
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }

    const BTN_HTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013 3h7a3 3 0 013 3v1"/></svg> เข้าสู่ระบบ`;
    function resetBtn() { const b = document.getElementById('login-btn'); b.disabled = false; b.innerHTML = BTN_HTML; }

    // ถ้ามี PIN/ห้องสอบติดมากับลิงก์ ส่งต่อไปหน้าพอร์ทัลนักศึกษา
    const qs = new URLSearchParams(location.search);
    const urlPin = (qs.get('pin') || qs.get('code') || '').trim(), urlRoom = (qs.get('roomId') || '').trim();
    function goStudent() {
      location.href = urlPin ? `student-portal.html?code=${encodeURIComponent(urlPin)}${urlRoom ? `&roomId=${encodeURIComponent(urlRoom)}` : ''}` : 'student-portal.html';
    }

    async function login() {
      if (document.getElementById('sp-modal')) return;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showError('กรุณากรอกรหัสนักศึกษา/ชื่อผู้ใช้ และรหัสผ่าน'); return; }
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> กำลังตรวจสอบ...`;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (data.success && data.teacher) {
          // อาจารย์ / แอดมิน
          localStorage.setItem('teacher_username', data.teacher.username);
          localStorage.setItem('teacher_name', data.teacher.name);
          localStorage.setItem('teacher_role', data.teacher.role);
          if (data.teacher.role === 'admin') {
            // หน้า Super Admin ใช้ค่าชุดนี้ตรวจว่าเข้าสู่ระบบแล้ว
            localStorage.setItem('admin_username', data.teacher.username);
            localStorage.setItem('admin_name', data.teacher.name);
          } else {
            localStorage.removeItem('admin_username'); localStorage.removeItem('admin_name');
          }
          location.href = data.teacher.role === 'admin' ? 'super-admin.html' : 'dashboard.html';
          return;
        }
        if (data.success && data.student) {
          // นักศึกษา
          localStorage.setItem('currentStudent', JSON.stringify(data.student));
          sessionStorage.setItem('currentStudent', JSON.stringify(data.student));
          if (data.isDefaultPassword) { showStudentPwModal(data.student.studentId); resetBtn(); return; }
          goStudent();
          return;
        }
        showError(res.status === 404 ? 'ไม่พบบัญชีนี้ กรุณาตรวจสอบรหัสนักศึกษาหรือชื่อผู้ใช้ (นักศึกษาต้องมีชื่อในรายวิชาก่อน)' : (data.message || 'เข้าสู่ระบบล้มเหลว'));
        resetBtn();
      } catch(e) {
        showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        resetBtn();
      }
    }

    // นักศึกษาที่ยังใช้รหัสเริ่มต้น → ตั้งรหัสใหม่ก่อนเข้าใช้งาน
    function showStudentPwModal(studentId) {
      const d = document.createElement('div');
      d.id = 'sp-modal';
      d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,11,38,.72);display:flex;align-items:center;justify-content:center;padding:18px';
      d.innerHTML = '<div style="width:100%;max-width:400px;background:#fff;border-radius:20px;padding:24px 22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);font-family:Noto Sans Thai Looped, sans-serif;color:#0f1d3a">' +
        '' +
        '<h3 style="margin:0 0 6px;text-align:center;font-size:20px;color:#0d3b8e">ตั้งรหัสผ่านใหม่</h3>' +
        '<p style="margin:0 0 14px;text-align:center;font-size:14px;line-height:1.6;color:#4a5872">เข้าสู่ระบบครั้งแรก กรุณาตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร (ห้ามเป็น 1234 หรือรหัสนักศึกษา)</p>' +
        '<input type="password" id="sp1" placeholder="รหัสผ่านใหม่" autocomplete="new-password" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #d6deea;border-radius:12px;font:inherit;font-size:16px;margin-bottom:10px">' +
        '<input type="password" id="sp2" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง" autocomplete="new-password" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #d6deea;border-radius:12px;font:inherit;font-size:16px">' +
        '<div id="spe" style="min-height:20px;margin:8px 2px 0;font-size:13px;color:#d33"></div>' +
        '<button type="button" id="spb" style="width:100%;margin-top:6px;padding:13px;border:0;border-radius:12px;background:#0d3b8e;color:#fff;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer">บันทึกและเข้าสู่ระบบ</button></div>';
      document.body.appendChild(d);
      const $ = id => document.getElementById(id), err = m => { $('spe').textContent = m; };
      setTimeout(() => $('sp1').focus(), 50);
      const submit = async () => {
        const a = $('sp1').value.trim(), b = $('sp2').value.trim();
        if (a.length < 6 || a === '1234' || a === studentId) return err('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร และห้ามเป็น 1234 หรือรหัสนักศึกษา');
        if (a !== b) return err('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
        $('spb').disabled = true; $('spb').textContent = 'กำลังบันทึก...';
        try {
          const r = await fetch('/api/student/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ studentId, newPassword: a }) });
          const j = await r.json().catch(() => ({}));
          if (!r.ok || !j.success) throw new Error(j.message || 'บันทึกไม่สำเร็จ');
          goStudent();
        } catch (e) { err(e.message); $('spb').disabled = false; $('spb').textContent = 'บันทึกและเข้าสู่ระบบ'; }
      };
      $('spb').addEventListener('click', submit);
      d.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); submit(); } });
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.querySelector('span').textContent = msg;
      el.classList.remove('hidden');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
