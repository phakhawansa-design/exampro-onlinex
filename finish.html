<!DOCTYPE html>
<html lang="th">
<head>
    <script src="auth-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งคำตอบเรียบร้อยแล้ว · ExamPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai Looped', sans-serif;
            background: linear-gradient(135deg, #fff6ed 0%, #f0f9ff 50%, #eef4ff 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,154,60, 0.25);
            box-shadow: 0 25px 60px -15px rgba(255,122,26, 0.15), 0 12px 30px -5px rgba(56, 189, 248, 0.1);
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .pulse-glow {
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255,154,60, 0.15); }
            100% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.35); }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js" defer></script>
    <link rel="stylesheet" href="tailwind.css">
</head>
<body class="text-slate-700 min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 relative overflow-x-hidden">
    
    <!-- Dynamic Glowing Backdrop Lights -->
    <div class="fixed w-[400px] h-[400px] bg-pink-400/20 blur-[120px] rounded-full -top-20 -left-20 pointer-events-none"></div>
    <div class="fixed w-[450px] h-[450px] bg-sky-400/20 blur-[130px] rounded-full -bottom-20 -right-20 pointer-events-none"></div>
    <div class="fixed w-[350px] h-[350px] bg-purple-400/15 blur-[100px] rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

    <!-- Main Finish Card -->
    <div class="w-full max-w-md glass-card p-6 sm:p-9 rounded-3xl text-center space-y-6 z-10 relative">
        
        <!-- Header Mascot Icon (ซ่อน: ไม่ใช้อีโมจิแล้ว แต่คง element ไว้ให้สคริปต์เดิมทำงานได้) -->
        <div class="relative inline-block" style="display:none">
            <div class="absolute inset-0 bg-gradient-to-tr from-pink-400 to-sky-400 rounded-full blur-md opacity-40 animate-pulse"></div>
            <div class="relative w-24 h-24 bg-white border-2 border-pink-100 rounded-full flex items-center justify-center text-5xl shadow-lg select-none animate-float mx-auto" id="mascot-emoji">
                
            </div>
        </div>

        <div class="space-y-1.5">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight bg-gradient-to-r from-pink-600 via-purple-600 to-sky-600 bg-clip-text text-transparent">
                ส่งข้อสอบสำเร็จเรียบร้อย!
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 font-medium">ระบบได้บันทึกคำตอบของคุณเข้าสู่คลังฐานข้อมูลแล้ว</p>
        </div>

        <!-- Student Information Card -->
        <div class="bg-gradient-to-br from-white/90 to-slate-50/80 border border-slate-200/80 p-4.5 rounded-2xl text-left text-xs space-y-2.5 shadow-sm">
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-pink-500"></span> ผู้เข้าสอบ:
                </span>
                <strong class="text-slate-800 font-bold" id="display-name">กำลังดึงข้อมูล...</strong>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-sky-500"></span> รหัสนักศึกษา:
                </span>
                <strong class="text-slate-800 font-mono font-bold" id="display-id">-</strong>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-slate-400 font-medium flex items-center gap-1.5">
                    <span class="text-purple-500"></span> ห้องสอบ:
                </span>
                <strong class="text-sky-600 font-mono font-bold bg-sky-50 px-2.5 py-0.5 rounded-lg border border-sky-100" id="display-room">-</strong>
            </div>
        </div>

        <!-- Score & Teasing Container -->
        <div class="border-t border-pink-100/80 pt-5 space-y-4">
            
            <!-- Score Section (Toggleable) -->
            <div id="score-section" class="hidden space-y-3">
                <div class="text-[11px] font-black text-slate-400 uppercase tracking-widest">คะแนนสอบที่คุณทำได้</div>
                
                <div class="inline-flex items-baseline justify-center gap-1.5 px-6 py-3 bg-gradient-to-r from-pink-50 via-purple-50 to-sky-50 border border-pink-200/60 rounded-2xl shadow-inner pulse-glow">
                    <span class="text-3xl font-black text-pink-600 font-mono" id="score-num">0</span>
                    <span class="text-lg font-bold text-slate-400">/</span>
                    <span class="text-xl font-bold text-slate-600 font-mono" id="max-score-num">0</span>
                    <span class="text-xs font-bold text-slate-500 ml-1">คะแนน</span>
                </div>
                
                <!-- Score Bar Fill -->
                <div class="w-full bg-slate-100 border border-slate-200 h-3 rounded-full overflow-hidden p-0.5 shadow-inner">
                    <div id="score-bar-fill" class="bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 h-full rounded-full transition-all duration-1000 shadow-sm" style="width: 0%"></div>
                </div>
            </div>

            <!-- Funny Teasing Quote Banner -->
            <div class="p-4 bg-gradient-to-r from-pink-50/70 via-purple-50/50 to-sky-50/70 border border-pink-100 rounded-2xl shadow-xs">
                <p id="teasing-quote" class="text-xs text-slate-600 leading-relaxed font-semibold">
                    กำลังประมวลผลคำตอบ... 
                </p>
            </div>

        </div>

        <!-- Lobby Action Buttons -->
        <div class="pt-2 flex flex-col gap-3">
            <a href="student-portal.html" 
                class="block w-full text-center py-3.5 bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 hover:from-pink-600 hover:to-sky-600 text-white rounded-2xl font-bold text-sm transition-all duration-300 shadow-lg shadow-pink-500/25 active:scale-[0.98]">
                กลับสู่หน้าหลักนักศึกษา
            </a>
            <a href="Student-login.html" 
                class="block w-full text-center py-2.5 bg-white/80 hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-2xl font-bold text-xs transition duration-200 active:scale-[0.98]">
                ออกจากระบบ / เข้าสู่ระบบใหม่
            </a>
        </div>

    </div>

    <!-- ผลรายข้อ: ถูก/ผิดทันที · เฉลยหลังอาจารย์ปิดห้องสอบ -->
    <section id="rv" class="rvx" hidden aria-labelledby="rv-title">
        <div class="rvx-h">
            <div>
                <h2 id="rv-title">ผลรายข้อ</h2>
                <p id="rv-sub"></p>
            </div>
            <div class="rvx-sum" id="rv-sum"></div>
        </div>
        <div class="rvx-tabs" id="rv-tabs" role="group" aria-label="กรองรายข้อ">
            <button type="button" data-f="all" aria-pressed="true">ทั้งหมด</button>
            <button type="button" data-f="wrong" aria-pressed="false">ข้อที่ผิด / ไม่ได้ตอบ</button>
        </div>
        <ol class="rvx-list" id="rv-list"></ol>
    </section>
    <style>
        .rvx { max-width: 760px; margin: 18px auto 28px; padding: 22px 20px; background: #fff; border-radius: 24px; border: 1px solid #e5eaf2; box-shadow: 0 20px 50px -24px rgba(11,42,122,.35); position: relative; z-index: 10; }
        .rvx[hidden] { display: none; }
        .rvx-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
        .rvx-h h2 { margin: 0; font-size: 20px; font-weight: 800; color: #0f172a; }
        .rvx-h p { margin: 2px 0 0; font-size: 13.5px; color: #64748b; line-height: 1.5; }
        .rvx-sum { display: flex; gap: 8px; flex-wrap: wrap; }
        .rvx-sum span { padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 800; }
        .rvx-sum .ok { background: #e7f8ee; color: #15803d; } .rvx-sum .no { background: #fdecea; color: #b91c1c; } .rvx-sum .skip { background: #f1f5f9; color: #475569; }
        .rvx-tabs { display: flex; gap: 6px; margin: 14px 0 6px; }
        .rvx-tabs button { padding: 7px 14px; border-radius: 99px; border: 1.5px solid #cbd5e1; background: #fff; font: inherit; font-size: 13.5px; font-weight: 700; color: #334155; cursor: pointer; }
        .rvx-tabs button[aria-pressed="true"] { background: #0b2a7a; border-color: #0b2a7a; color: #fff; }
        .rvx-list { list-style: none; margin: 0; padding: 0; }
        .rvx-q { padding: 14px 0; border-top: 1px solid #eef2f7; }
        .rvx-q:first-child { border-top: 0; }
        .rvx-qh { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; color: #0f172a; line-height: 1.55; }
        .rvx-no { flex: none; min-width: 64px; text-align: center; padding: 3px 8px; border-radius: 10px; font-size: 12.5px; font-weight: 800; }
        .rvx-no.ok { background: #e7f8ee; color: #15803d; } .rvx-no.no { background: #fdecea; color: #b91c1c; } .rvx-no.skip { background: #f1f5f9; color: #475569; }
        .rvx-img { max-width: 100%; max-height: 220px; border-radius: 12px; border: 1px solid #e2e8f0; margin: 8px 0 0 74px; }
        .rvx-ch { list-style: none; margin: 8px 0 0 74px; padding: 0; display: grid; gap: 6px; }
        .rvx-ch li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 14px; color: #334155; }
        .rvx-ch li b { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: #f1f5f9; font-size: 12.5px; }
        .rvx-ch li em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 800; white-space: nowrap; }
        .rvx-ch li.mine-ok { border-color: #16a34a; background: #effaf3; } .rvx-ch li.mine-ok em { color: #15803d; }
        .rvx-ch li.mine-no { border-color: #dc2626; background: #fef2f2; } .rvx-ch li.mine-no em { color: #b91c1c; }
        .rvx-ch li.key { border-color: #16a34a; border-style: dashed; } .rvx-ch li.key em { color: #15803d; }
        .rvx-note { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: #fff7ef; color: #9a3412; font-size: 13.5px; line-height: 1.6; }
        @media (max-width: 560px) { .rvx { margin: 14px 12px 24px; padding: 18px 14px; } .rvx-ch, .rvx-img { margin-left: 0; } .rvx-qh { flex-direction: column; gap: 6px; } }
    </style>

    <script>
        // ===== ผลรายข้อ =====
        (function () {
            const p = new URLSearchParams(location.search);
            const roomId = p.get('roomId');
            if (!roomId || p.get('showScore') === '0') return;
            const TH = { a: 'ก', b: 'ข', c: 'ค', d: 'ง', e: 'จ', f: 'ฉ', g: 'ช', h: 'ซ', i: 'ฌ', j: 'ญ' };
            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            let data = null, filter = 'all';
            function render() {
                const list = data.items.filter(it => filter === 'all' || !it.correct);
                document.getElementById('rv-list').innerHTML = list.length ? list.map(it => {
                    const st = it.correct ? 'ok' : it.mine ? 'no' : 'skip';
                    const tag = it.correct ? 'ข้อ ' + it.no + ' ถูก' : it.mine ? 'ข้อ ' + it.no + ' ผิด' : 'ข้อ ' + it.no + ' ไม่ได้ตอบ';
                    const ch = it.choices.map(c => {
                        const mine = it.mine === c.key, key = it.answer && it.answer === c.key;
                        const cls = mine ? (it.correct ? 'mine-ok' : 'mine-no') : key ? 'key' : '';
                        const em = mine ? (it.correct ? 'คำตอบของคุณ ✓' : 'คำตอบของคุณ ✗') : key ? 'เฉลย' : '';
                        return '<li class="' + cls + '"><b>' + (TH[c.key] || c.key) + '</b><span>' + esc(c.text) + '</span>' + (em ? '<em>' + em + '</em>' : '') + '</li>';
                    }).join('');
                    return '<li class="rvx-q"><div class="rvx-qh"><span class="rvx-no ' + st + '">' + tag + '</span><span>' + esc(it.question) + '</span></div>' +
                        (it.image ? '<img class="rvx-img" src="' + esc(it.image) + '" alt="">' : '') + '<ul class="rvx-ch">' + ch + '</ul></li>';
                }).join('') : '<li class="rvx-q" style="color:#15803d;font-weight:700">ถูกทุกข้อ ยอดเยี่ยมมาก</li>';
            }
            document.getElementById('rv-tabs').addEventListener('click', e => {
                const b = e.target.closest('button'); if (!b || !data) return;
                filter = b.dataset.f;
                document.querySelectorAll('#rv-tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
                render();
            });
            fetch('/api/student/result-detail?roomId=' + encodeURIComponent(roomId)).then(r => r.ok ? r.json() : null).then(d => {
                if (!d) return;
                // ชื่อห้องสอบ: แสดงชื่อข้อสอบแทนรหัสห้อง
                const room = document.getElementById('display-room');
                if (room && (d.examTitle || d.courseName)) room.textContent = d.examTitle || d.courseName;
                if (d.hidden) return;
                const box = document.getElementById('rv');
                if (d.unavailable || !Array.isArray(d.items)) {
                    document.getElementById('rv-sub').textContent = d.message || 'ไม่มีรายละเอียดรายข้อ';
                    document.getElementById('rv-tabs').hidden = true;
                    box.hidden = false; return;
                }
                data = d;
                const ok = d.items.filter(i => i.correct).length, skip = d.items.filter(i => !i.mine).length, no = d.items.length - ok - skip;
                document.getElementById('rv-sum').innerHTML = '<span class="ok">ถูก ' + ok + '</span><span class="no">ผิด ' + no + '</span>' + (skip ? '<span class="skip">ไม่ได้ตอบ ' + skip + '</span>' : '');
                document.getElementById('rv-sub').textContent = [d.courseCode, d.courseName].filter(Boolean).join(' ') + (d.examTitle ? ' · ' + d.examTitle : '');
                box.hidden = false;
                render();
                if (!d.closed) box.insertAdjacentHTML('beforeend', '<p class="rvx-note">เฉลยของแต่ละข้อจะแสดงหลังอาจารย์ปิดห้องสอบ (เพื่อไม่ให้เฉลยไปถึงเพื่อนที่ยังสอบอยู่) · กลับมาดูได้ที่หน้าหลักนักศึกษา › ประวัติการสอบ</p>');
            }).catch(() => {});
        })();

        function getUrlParams() {
            const params = {};
            const search = window.location.search.substring(1);
            if (!search) return params;
            
            const pairs = search.split("&");
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split("=");
                params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || "");
            }
            return params;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = getUrlParams();
            
            if (!params.roomId) {
                document.getElementById('display-name').textContent = "คนแอบแฝง";
                document.getElementById('display-id').textContent = "999999";
                document.getElementById('display-room').textContent = "ลับเฉพาะ";
                document.getElementById('mascot-emoji').textContent = "";
                document.getElementById('teasing-quote').textContent = "แอบลิงก์เข้ามาตรงๆ โดยไม่ได้ทำข้อสอบใช่ไหมล่ะเรา? รู้นะ! กลับไปล็อกอินสอบก่อนนะวัยรุ่น ";
                return;
            }

            document.getElementById('display-name').textContent = params.studentName || 'ไม่ระบุชื่อ';
            document.getElementById('display-id').textContent = params.studentId || '-';
            document.getElementById('display-room').textContent = params.roomId || '-';

            const score = parseInt(params.score) || 0;
            const maxScore = parseInt(params.maxScore) || 1;
            const showScore = parseInt(params.showScore) === 1;

            const teaseEl = document.getElementById('teasing-quote');
            const emojiEl = document.getElementById('mascot-emoji');

            if (showScore) {
                document.getElementById('score-section').classList.remove('hidden');
                document.getElementById('score-num').textContent = score;
                document.getElementById('max-score-num').textContent = maxScore;
                
                const percent = Math.min(100, Math.max(0, (score / maxScore) * 100));
                setTimeout(() => {
                    document.getElementById('score-bar-fill').style.width = `${percent}%`;
                }, 300);

                if (percent === 100) {
                    emojiEl.textContent = "";
                    teaseEl.textContent = "กราบแทบตักคุณพี่ศิษย์เอก! หัวดีเกินมนุษย์ขนาดนี้ ลอกเพื่อนนั่งข้างๆ มาป่ะเนี่ย หรือจารย์เฉลยข้อสอบรั่ว? ";
                } else if (percent >= 70) {
                    emojiEl.textContent = "";
                    teaseEl.textContent = "เก่งไม่ธรรมดาเลยนะเราน่ะ! แอบอ่านสรุปตอนกวาดบ้านหรือพกเครื่องรางวัดดังมาสอบเหรอรอบนี้? ผ่านฉลุยจ้า! ";
                } else if (percent >= 50) {
                    emojiEl.textContent = "";
                    teaseEl.textContent = "รอดตายหวุดหวิดประหนึ่งปาฏิหาริย์! คะแนนผ่านเส้นยาแดงผ่าแปด สะดุดล้มหน้าคะมำก็ตกอ่ะบอกเลย ทำบุญปล่อยปลาด่วน! ";
                } else {
                    emojiEl.textContent = "";
                    teaseEl.textContent = "สอบตกจ้า! นี่คะแนนสอบหรือคะแนนความน่าจะเป็นของอุณหภูมิห้องห้องปรับอากาศ? ต่ำเตี้ยเรี่ยราดปวดใจจี๊ดเลยเพื่อน! ";
                }
            } else {
                emojiEl.textContent = "";
                
                const hiddenQuotes = [
                    "ส่งกระดาษคำตอบสำเร็จ! แต่คะแนนเป็นความลับระดับสุดยอด (Top Secret) รอลุ้นเกรดเอาเองนะ ถ้าอาจารย์ไม่อ่านการ์ตูนจนลืมตรวจ! ",
                    "ทำข้อสอบเสร็จแล้วก็รีบปิดคอมพ์ไปวิ่งเล่นข้างนอกซะ! คะแนนของคุณปลอดภัยในระบบดี... (มั้งนะ )",
                    "บันทึกผลสอบเข้าระบบเรียบร้อย! ส่วนคะแนนนั้น... ลอยอยู่ในหลุมดำ รออาจารย์ปล่อยคิวเฉลยรอบหน้าทีเดียวนะจ๊ะ "
                ];
                const randomQuoteIndex = (score + maxScore) % hiddenQuotes.length;
                teaseEl.textContent = hiddenQuotes[randomQuoteIndex];
            }
        });
    </script>
</body>
</html>
