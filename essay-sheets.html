<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พิมพ์กระดาษคำตอบ · ตรีเนตร e-Exam</title>
<script src="auth-client.js"></script>
<script src="trinetra-mark.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d3b8e;--navy2:#082a6b;--gold:#f6b818;--line:#c7cfdc;--ink:#111827}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e9edf4;font-family:Sarabun,"Leelawadee UI",Tahoma,sans-serif;color:var(--ink)}
  /* ---------- toolbar (screen only) ---------- */
  .bar{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--navy2),var(--navy));color:#fff;padding:12px 16px;box-shadow:0 6px 20px rgba(8,42,107,.25)}
  .bar .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .bar h1{font:600 18px Kanit,sans-serif;margin:0;flex:1 1 260px}
  .bar h1 small{display:block;font:400 13px Sarabun,sans-serif;opacity:.8}
  .bar label{font-size:14px;display:flex;align-items:center;gap:6px}
  .bar select,.bar input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:0;color:var(--ink)}
  .bar input[type=number]{width:60px}
  .bar button{font:600 15px Sarabun,sans-serif;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--gold);color:var(--navy2);box-shadow:0 3px 0 #c58f00}
  .bar button:disabled{opacity:.5}
  .bar a{color:#ffcf4a;font-size:14px}
  .msg{max-width:1100px;margin:14px auto;padding:0 16px;font-size:15px}
  .msg .box{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 4px 14px rgba(8,42,107,.08)}
  .msg .err{background:#fff1f1;color:#a12020}
  #pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 10px 60px}
  /* ---------- A4 page ---------- */
  .page{width:210mm;height:297mm;padding:11mm 13mm 9mm;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .hd{display:flex;gap:6mm;align-items:flex-start;border-bottom:.6mm solid var(--navy);padding-bottom:3mm}
  .hd .t{flex:1;min-width:0}
  .brand{font:600 9pt Kanit,sans-serif;color:var(--navy);letter-spacing:.2px}
  .brand b{color:#b98500}
  .course{font-size:10.5pt;color:#374151;margin-top:.8mm}
  .title{font:700 15pt Sarabun,sans-serif;margin-top:.6mm;line-height:1.25}
  .mk{flex:none;text-align:center}
  .mk small{display:block;font-size:6.5pt;color:#6b7280;margin-top:.8mm;letter-spacing:.1px}
  .info{display:grid;grid-template-columns:1.35fr 1fr;border:.3mm solid #9ca3af;border-radius:2mm;margin-top:3mm;font-size:11pt}
  .info div{padding:2mm 3mm;border-bottom:.3mm solid #d1d5db}
  .info div:nth-child(odd){border-right:.3mm solid #d1d5db}
  .info div:nth-last-child(-n+2){border-bottom:0}
  .info span{color:#6b7280;font-size:9.5pt;margin-right:2mm}
  .info b{font-weight:700}
  .info i{display:inline-block;width:28mm;border-bottom:.3mm dotted #6b7280;font-style:normal}
  .mini{display:flex;gap:6mm;align-items:center;font-size:10.5pt;color:#374151}
  .mini b{color:var(--ink)}
  .note{font-size:8.5pt;color:#6b7280;margin:2mm 0 0}
  .body{flex:1;min-height:0;overflow:hidden;padding-top:3mm}
  .q{margin-bottom:3mm}
  .qh{font-size:11.5pt;line-height:1.45}
  .qh b{color:var(--navy)}
  .qh em{font-style:normal;color:#6b7280;font-size:10pt}
  .ans{border:.3mm solid #9ca3af;border-radius:1.5mm;margin-top:1.5mm;padding:0 3mm}
  .ln{height:var(--lh,8.5mm);border-bottom:.25mm solid var(--line)}
  .ln:last-child{border-bottom:0}
  .ft{display:flex;justify-content:space-between;font-size:8.5pt;color:#6b7280;border-top:.3mm solid #e5e7eb;padding-top:1.5mm;margin-top:2mm}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar,.msg{display:none!important}
    #pages{padding:0;gap:0}
    .page{box-shadow:none;break-after:page;page-break-after:always}
    .page:last-child{break-after:auto;page-break-after:auto}
  }
  @media screen and (max-width:860px){ .page{zoom:.45} }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <h1 id="h1">กระดาษคำตอบ<small>กำลังโหลด...</small></h1>
  <label>ชั้นเรียน <select id="cls"><option value="">ทั้งหมด</option></select></label>
  <label title="จำนวนเส้นให้เขียนตอบต่อ 1 ข้อ (ข้อที่กำหนดจำนวนเส้นไว้ในหน้าสร้างงาน จะใช้ค่าของข้อนั้นแทน)">เส้นตอบต่อข้อ <input id="lpq" type="number" min="1" max="40" value="6"></label>
  <label>ระยะห่างเส้น <select id="lsp"><option value="7">ชิด</option><option value="8.5" selected>ปกติ</option><option value="10">ห่าง</option></select></label>
  <label><input id="showQ" type="checkbox" checked> พิมพ์โจทย์</label>
  <button id="print" disabled onclick="downloadPdf()">⬇️ ดาวน์โหลด PDF / พิมพ์</button>
  <a href="admin-essay.html">← กลับหน้าตรวจอัตนัย</a>
</div></div>
<div class="msg" id="msg"></div>
<div id="pages"></div>

<script>
(async function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const username = localStorage.getItem('teacher_username') || 'admin';
  const U = encodeURIComponent(username);
  const aid = Number(new URLSearchParams(location.search).get('assignmentId'));
  const say = (h, err) => { $('#msg').innerHTML = `<div class="box ${err ? 'err' : ''}">${h}</div>`; };
  async function api(url) {
    const r = await fetch(url); const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status)); return j;
  }
  if (!aid) return say('ไม่พบรหัสงาน กรุณาเปิดหน้านี้จากปุ่ม "พิมพ์กระดาษคำตอบ" ในหน้าตรวจอัตนัย', true);

  let A, course = {}, roster = [];
  try {
    A = (await api(`/api/essay/submissions?username=${U}&assignmentId=${aid}`)).assignment;
    if (!A.course_id) return say('งานนี้ยังไม่ได้ผูกกับรายวิชา กลับไปหน้าตรวจอัตนัย กด <b>แก้ไขงาน</b> แล้วเลือกรายวิชา จึงจะดึงรายชื่อนักศึกษามาพิมพ์ได้', true);
    const courses = await api(`/api/teacher/courses?username=${U}`).catch(() => []);
    course = courses.find(c => c.id == A.course_id) || {};
    roster = await api(`/api/courses/${A.course_id}/students`);
  } catch (e) { return say('โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message), true); }
  if (!roster.length) return say('รายวิชานี้ยังไม่มีรายชื่อนักศึกษา เพิ่มรายชื่อที่หน้า <b>จัดการรายวิชา</b> ก่อน', true);

  const maxTotal = A.questions.reduce((t, q) => t + Number(q.maxScore || 0), 0);
  const courseLabel = [course.courseCode, course.courseName].filter(Boolean).join(' ') || ('รายวิชา #' + A.course_id);
  $('#h1').innerHTML = `กระดาษคำตอบ: ${esc(A.title)}<small>${esc(courseLabel)} · ${A.questions.length} ข้อ · คะแนนเต็ม ${maxTotal}</small>`;
  const classes = [...new Set(roster.map(r => (r.class || '').trim()).filter(Boolean))].sort();
  $('#cls').innerHTML = '<option value="">ทั้งหมด (' + roster.length + ' คน)</option>' + classes.map(c => `<option>${esc(c)}</option>`).join('');

  const fullName = r => `${r.prefix || ''}${r.firstName || ''} ${r.lastName || ''}`.replace(/\s+/g, ' ').trim();
  const mark = (r, page) => TrinetraMark.svg({ assignmentId: aid, rosterId: r.id, page });

  function header(r, page) {
    if (page === 1) return `<div class="hd"><div class="t">
        <div class="brand">ตรีเนตร <b>e-Exam</b> · กระดาษคำตอบ</div>
        <div class="course">${esc(courseLabel)}</div>
        <div class="title">${esc(A.title)}</div></div>
        <div class="mk">${mark(r, page)}<small>รหัสตรีเนตร · ห้ามเขียนหรือพับทับ</small></div></div>
      <div class="info">
        <div><span>ชื่อ-นามสกุล</span><b>${esc(fullName(r))}</b></div>
        <div><span>รหัสนักศึกษา</span><b>${esc(r.studentId)}</b></div>
        <div><span>ชั้นเรียน</span><b>${esc(r.class || '-')}</b></div>
        <div><span>คะแนนรวม</span><i></i> / ${maxTotal}</div>
      </div>
      <p class="note">เขียนคำตอบในกรอบของแต่ละข้อเท่านั้น ใช้ปากกาสีเข้ม หากไม่พอให้เขียนต่อด้านล่างของกรอบ</p>`;
    return `<div class="hd"><div class="t"><div class="brand">ตรีเนตร <b>e-Exam</b> · ${esc(A.title)}</div>
        <div class="mini" style="margin-top:1.5mm"><span>ชื่อ <b>${esc(fullName(r))}</b></span><span>รหัส <b>${esc(r.studentId)}</b></span><span>แผ่นที่ <b class="pg">${page}</b></span></div></div>
        <div class="mk">${mark(r, page)}<small>รหัสตรีเนตร · ห้ามเขียนหรือพับทับ</small></div></div>`;
  }

  // สร้างกระดาษของนักศึกษา 1 คน (ตัดหน้าอัตโนมัติตามความสูงจริง)
  function buildStudent(r, host) {
    // จำนวนเส้นต่อข้อ: ใช้ค่าที่กำหนดรายข้อ (หน้าสร้างงาน) ถ้าไม่มีใช้ค่าตั้งต้นด้านบน
    // (เดิมคิดจากคะแนนเต็ม × 3 และขั้นต่ำ 5 เส้น → ข้อ 10 คะแนนได้ 30 เส้น เกือบเต็มหน้า)
    const lpq = Math.max(1, Math.min(40, Number($('#lpq').value) || 6)), showQ = $('#showQ').checked;
    const pages = [];
    const newPage = () => {
      const p = document.createElement('section'); p.className = 'page';
      p.innerHTML = header(r, pages.length + 1) + '<div class="body"></div><div class="ft"><span>ตรีเนตร e-Exam</span><span class="pf"></span></div>';
      host.appendChild(p); pages.push(p); return p.querySelector('.body');
    };
    const fits = b => b.scrollHeight <= b.clientHeight + 1;
    let body = newPage();
    for (const q of A.questions) {
      const lines = Number(q.lines) > 0 ? Math.min(40, Number(q.lines)) : lpq;
      let done = 0, cont = false;
      while (done < lines) {
        const blk = document.createElement('div'); blk.className = 'q';
        blk.innerHTML = `<div class="qh"><b>ข้อ ${q.no}${cont ? ' (ต่อ)' : ''}</b> <em>(${q.maxScore} คะแนน)</em>${showQ && !cont ? ' ' + esc(q.prompt) : ''}</div><div class="ans"></div>`;
        body.appendChild(blk);
        const ans = blk.querySelector('.ans');
        let added = 0;
        while (done + added < lines) {
          const l = document.createElement('div'); l.className = 'ln'; ans.appendChild(l);
          if (!fits(body)) { l.remove(); break; }
          added++;
        }
        if (added < 3 && done + added < lines) {          // ที่เหลือน้อยเกินไป ย้ายไปหน้าถัดไป
          blk.remove();
          if (pages.length >= 16) throw new Error('โจทย์ยาวเกิน 16 แผ่นต่อคน ลดจำนวนบรรทัดต่อคะแนนลง');
          body = newPage(); continue;
        }
        if (!fits(body)) { blk.remove(); body = newPage(); continue; }
        done += added; cont = done < lines;
        if (cont) { if (pages.length >= 16) throw new Error('โจทย์ยาวเกิน 16 แผ่นต่อคน ลดจำนวนบรรทัดต่อคะแนนลง'); body = newPage(); }
      }
    }
    pages.forEach((p, i) => { p.querySelector('.pf').textContent = `${r.studentId} · แผ่นที่ ${i + 1}/${pages.length}`; });
    return pages.length;
  }

  function render() {
    const host = $('#pages'); host.innerHTML = '';
    const cls = $('#cls').value, list = roster.filter(r => !cls || (r.class || '').trim() === cls);
    let per = 0;
    try { for (const r of list) per = buildStudent(r, host); }
    catch (e) { say(esc(e.message), true); $('#print').disabled = true; return; }
    say(`พร้อมแล้ว <b>${list.length} คน</b> · คนละ ${per} แผ่น · รวม ${list.length * per} หน้า (A4) — กด <b>⬇️ ดาวน์โหลด PDF</b> แล้วเลือกปลายทาง <b>"บันทึกเป็น PDF / Save as PDF"</b> (หรือเลือกเครื่องพิมพ์เพื่อพิมพ์ทันที)
      <br><span style="color:#6b7280;font-size:13px">ตั้งค่า: ขนาด A4, ระยะขอบ "ไม่มี/None", ขนาด 100% (ไม่ย่อให้พอดี) — สแกนกลับเข้าระบบเลือกโหมด <b>อ่านรหัสตรีเนตรอัตโนมัติ</b> ระบบจะแยกและจับชื่อให้เอง</span>`);
    $('#print').disabled = !list.length;
  }
  // ดาวน์โหลด PDF: ใช้หน้าต่างพิมพ์ของเบราว์เซอร์ (ภาษาไทยและรหัสตรีเนตรคมชัดที่สุด) ตั้งชื่อไฟล์ให้อัตโนมัติ
  window.downloadPdf = function () {
    const old = document.title, cls = $('#cls').value;
    document.title = ['กระดาษคำตอบ', A.title, course.courseCode, cls].filter(Boolean).join('_').replace(/[\\/:*?"<>|]+/g, '-');
    window.print();
    setTimeout(() => { document.title = old; }, 1500);
  };
  // จำค่าที่ตั้งไว้ในเครื่อง + ระยะห่างเส้น
  try { const v = localStorage.getItem('sheet_lpq'); if (v) $('#lpq').value = v; const s = localStorage.getItem('sheet_lsp'); if (s && [...$('#lsp').options].some(o => o.value === s)) $('#lsp').value = s; } catch (e) {}
  const applySpacing = () => document.documentElement.style.setProperty('--lh', $('#lsp').value + 'mm');
  applySpacing();
  const saveOpts = () => { try { localStorage.setItem('sheet_lpq', $('#lpq').value); localStorage.setItem('sheet_lsp', $('#lsp').value); } catch (e) {} };
  $('#cls').addEventListener('change', render);
  $('#lpq').addEventListener('change', () => { saveOpts(); render(); });
  $('#lsp').addEventListener('change', () => { saveOpts(); applySpacing(); render(); });
  $('#showQ').addEventListener('change', render);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  render();
})();
</script>
</body>
</html>
